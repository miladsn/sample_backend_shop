# ==============================================================================
# LOCAL DEVELOPMENT ENVIRONMENT
# NOTE: This compose setup is optimized for local development and testing
# (includes DEBUG=1, Django runserver, and host port mappings).
# For production: use Gunicorn/Uvicorn, secrets manager, and production-grade configs.
# ==============================================================================
version: '3.8'

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
# MySQL Database
  db:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce_db}
      MYSQL_USER: ${DB_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-user1234}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ecommerce_network
    <<: *default-logging

# Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_network
    <<: *default-logging

# Django Backend
  django:
    build:
      context: ./backend_django
      dockerfile: Dockerfile
    container_name: ecommerce_django
    restart: unless-stopped
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend_django:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-ecommerce_db}
      - DB_USER=${DB_USER:-ecommerce_user}
      - DB_PASSWORD=${DB_PASSWORD:-user1234}
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-key-123}
      - DEBUG=1
      - DJANGO_ALLOWED_HOSTS=django,localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ecommerce_network
    <<: *default-logging

# API Gateway (FastAPI)
  gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: ecommerce_gateway
    restart: unless-stopped
    volumes:
      - ./api_gateway:/app
    ports:
      - "8001:8001"
    environment:
      - DJANGO_BASE_URL=http://django:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      django:
        condition: service_started
    networks:
      - ecommerce_network
    <<: *default-logging

networks:
  ecommerce_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
